<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>PC Build Advisor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      if (!navigator.gpu) {
        document.write(
          '<div style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:#0b0d10;color:#e8eaed;font-family:sans-serif;padding:2rem;text-align:center">' +
          '<div style="max-width:480px">' +
          '<h1 style="font-size:1.5rem;margin-bottom:0.5rem">WebGPU non supportato</h1>' +
          '<p style="color:#9aa0a6;line-height:1.5">PC Build Advisor richiede un browser con WebGPU. Usa <strong>Chrome 113+</strong>, <strong>Edge 113+</strong> o <strong>Opera 99+</strong>.</p>' +
          '</div></div>'
        );
      }
    </script>
    <script type="module" crossorigin src="/assets/index-DYxGDTtj.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-BqxLS4iC.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
      (async function () {
        function showError(title, detail) {
          document.getElementById("root").innerHTML =
            '<div style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:#0b0d10;color:#e8eaed;font-family:sans-serif;padding:2rem;text-align:center">' +
            '<div style="max-width:520px">' +
            '<h1 style="font-size:1.5rem;margin-bottom:0.5rem">' + title + '</h1>' +
            '<p style="color:#9aa0a6;line-height:1.5">' + detail + '</p>' +
            '</div></div>';
        }
        if (!window.crossOriginIsolated) {
          showError("Cross-Origin Isolation richiesta",
            "PC Build Advisor richiede che il server invii gli header <code>Cross-Origin-Opener-Policy: same-origin</code> e <code>Cross-Origin-Embedder-Policy: require-corp</code>. Avvia con <code>npm run dev</code> o consulta il README."
          );
          return;
        }
        try {
          const adapter = await navigator.gpu.requestAdapter();
          if (!adapter) {
            showError("GPU non disponibile",
              "Il browser supporta WebGPU ma non è stata trovata una GPU compatibile. Verifica che i driver della scheda grafica siano aggiornati e che nessun'altra app stia usando intensamente la GPU."
            );
            return;
          }
        } catch (e) {
          showError("WebGPU errore",
            "WebGPU ha restituito un errore: " + e.message + ". Prova ad aggiornare il browser o reinstallare i driver GPU."
          );
        }
      })();
    </script>
  </body>
</html>
